<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přihlášky | Samet na GPB</title>
    <style>
        :root {
            --primary-color: #111;
            --accent-color: #e63946;
            --text-color: #333;
            --bg-color: #fff;
            --gray-bg: #f8f9fa;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }
        .notice-box {
            background-color: var(--gray-bg);
            border: 1px solid #eceff1;
            padding: 24px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #555;
            margin: 30px 0;
        }
        .btn-back {
            display: inline-block;
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 500;
            border: 2px solid var(--primary-color);
            padding: 10px 24px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        .btn-back:hover {
            background-color: var(--primary-color);
            color: var(--bg-color);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="notice-box">
            Přihlášky se otevřou v 15:00
        </div>

        <a href="index.html" class="btn-back">Zpět</a>
    </div>

</body>
</html>
