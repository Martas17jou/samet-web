<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samet na GPB</title>
    
    <style>
        @font-face {
            font-family: 'Garet';
            src: url('home/fonts/Garet-Book.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: 'Garet';
            src: url('home/fonts/Garet-Heavy.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }

        :root {
            --primary-color: #071D6A;
            --text-color: #ffffff;
            --accent-glow: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--primary-color);
            color: var(--text-color);
            font-family: 'Garet', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(7,29,106,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        .container {
            text-align: center;
            z-index: 2;
            padding: 20px;
            max-width: 90%;
        }

        h1 {
            font-weight: 700;
            font-size: clamp(3.5rem, 10vw, 7rem);
            text-transform: uppercase;
            line-height: 0.9;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        p {
            font-size: clamp(1rem, 3vw, 1.25rem);
            font-weight: 400;
            letter-spacing: 0.05em;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards;
            margin-bottom: 40px;
        }

        .loader-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards 0.6s;
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 1s ease-in-out infinite;
        }

        .manual-link {
            display: inline-block;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.85rem;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.4);
            transition: color 0.3s, border-color 0.3s;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards 1s;
        }

        .manual-link:hover {
            color: #ffffff;
            border-bottom-color: #ffffff;
        }

        /* Definice animací */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }
    </style>

    <script>
        setTimeout(function() {
            window.location.href = "./home/";
        }, 3000);
    </script>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        <h1>Samet<br>na GPB</h1>
        <p>PRAVDA A LÁSKA!</p>
        
        <div class="loader-container">
            <div class="loader"></div>
        </div>

        <a href="./home/" class="manual-link">Vstoupit ručně, pokud nejste přesměrováni</a>
    </div>

</body>
</html>
