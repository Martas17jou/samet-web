<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samet na GPB</title>
    <style>
        @import url('https://googleapis.com');

        @font-face {
            font-family: 'Garet';
            src: url('/home/fonts/Garet-Book.ttf') format('truetype'),
                 url('/home/fonts/Garet-Heavy.ttf') format('truetype');
            font-weight: 700;
        }

        :root {
            --primary: #071D6A;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--primary);
            color: #ffffff;
            font-family: 'Garet', 'Space Grotesk', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .ambient-glow {
            position: absolute;
            width: 150vw;
            height: 150vw;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(7,29,106,0) 60%);
            animation: pulse 4s ease-in-out infinite alternate;
            z-index: 1;
        }

        .content {
            text-align: center;
            z-index: 2;
            padding: 20px;
        }

        h1 {
            font-weight: 700;
            font-size: clamp(3rem, 12vw, 6.5rem);
            text-transform: uppercase;
            line-height: 1;
            letter-spacing: -0.01em;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(40px);
            animation: fadeInUp 0.8s cubic-bezier(0.2, 1, 0.2, 1) forwards;
        }

        p {
            font-size: clamp(0.85rem, 2.5vw, 1.1rem);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s cubic-bezier(0.2, 1, 0.2, 1) 0.2s forwards;
            margin-bottom: 40px;
            color: rgba(255, 255, 255, 0.7);
        }

        .loader-bar {
            width: 120px;
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            border-radius: 2px;
        }

        .loader-progress {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #ffffff;
            left: -100%;
            animation: load 2.3s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.6; }
            100% { transform: scale(1.05); opacity: 1; }
        }
        @keyframes load {
            to { left: 0; }
        }
    </style>
    <script>
        setTimeout(function() {
            window.location.href = "./home/";
        }, 2500);
    </script>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="content">
        <h1>Samet<br>na GPB</h1>
        <p>Pravda a láska!</p>
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
    </div>
</body>
</html>
